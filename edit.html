<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
</head>

<body>

    <h1>Update Student Details</h1>

    <form method="POST">

        <input type="text"
               name="name"
               value="{{ student.name }}"
               required>

        <br><br>

        <input type="number"
               name="age"
               value="{{ student.age }}"
               min="1"
               required>

        <br><br>

        <input type="text"
               name="course"
               value="{{ student.course }}"
               required>

        <br><br>

        <button type="submit">Update Student</button>

    </form>

    <br>

    <a href="/">Back to Home</a>

</body>
</html>
