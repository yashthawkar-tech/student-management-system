<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
</head>

<body>

    <h1>Add New Student</h1>

    <form method="POST">

        <input type="text"
               name="name"
               placeholder="Student Name"
               required>

        <br><br>

        <input type="number"
               name="age"
               placeholder="Student Age"
               min="1"
               required>

        <br><br>

        <input type="text"
               name="course"
               placeholder="Student Course"
               required>

        <br><br>

        <button type="submit">Save Student</button>

    </form>

    <br>

    <a href="/">Back to Home</a>

</body>
</html>
